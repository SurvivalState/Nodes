name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew jar --no-daemon -Pversion=${{ env.VERSION }}

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Nodes ${{ env.VERSION }}
          files: build/libs/Nodes-${{ env.VERSION }}.jar
          generate_release_notes: true
